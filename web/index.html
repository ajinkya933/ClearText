<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClearText demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #d6d3d1;
      --panel: #fafaf9;
      --accent: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 "Segoe UI", sans-serif;
      color: var(--ink);
      background: #fff;
    }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    h1 { font-size: 1.75rem; margin: 0 0 8px; }
    p.lead { margin: 0 0 24px; color: var(--muted); }
    fieldset {
      border: 1px solid var(--line);
      border-radius: 8px;
      margin: 0 0 16px;
      padding: 12px 16px 16px;
      background: var(--panel);
    }
    legend { padding: 0 6px; }
    label { display: block; margin: 8px 0; }
    button, .file input {
      font: inherit;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    button.busy:disabled { opacity: 1; cursor: wait; }
    button.busy::before {
      content: "";
      display: inline-block;
      width: 0.85em;
      height: 0.85em;
      margin-right: 8px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #fff;
      border-radius: 50%;
      vertical-align: -1px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #progress-wrap {
      display: none;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
    }
    #progress-wrap.visible { display: flex; }
    #progress-track {
      flex: 1;
      height: 10px;
      background: #e7e5e4;
      border-radius: 999px;
      overflow: hidden;
    }
    #progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.15s linear;
    }
    #progress-percent { min-width: 3em; font-variant-numeric: tabular-nums; }
    button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
    #status { min-height: 1.4em; color: var(--muted); }
    #status.error { color: #b91c1c; }
    figure { margin: 16px 0; }
    figcaption { color: var(--muted); margin-bottom: 6px; }
    canvas {
      max-width: 100%;
      height: auto;
      border: 1px solid var(--line);
      background: #fff;
    }
  </style>
</head>
<body>
  <main>
    <h1>ClearText</h1>
    <p class="lead">Choose a page. Nothing you select is uploaded.</p>

    <fieldset>
      <legend>Processing mode</legend>
      <label><input type="radio" name="mode" value="normal" checked> Normal</label>
      <label><input type="radio" name="mode" value="sharp"> Sharp</label>
    </fieldset>

    <div class="actions">
      <label class="file">Image
        <input id="file" type="file" accept="image/jpeg,image/png">
      </label>
      <button id="sample" type="button" class="secondary">Use sample page</button>
      <button id="process" type="button" disabled>Process image</button>
      <button id="download" type="button" class="secondary" disabled>Download result</button>
    </div>
    <div id="progress-wrap">
      <div id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill"></div>
      </div>
      <span id="progress-percent">0%</span>
    </div>
    <p id="status">Getting ready…</p>

    <figure id="original-figure" hidden>
      <figcaption>Original</figcaption>
      <canvas id="original"></canvas>
    </figure>
    <figure id="result-figure" hidden>
      <figcaption>Processed</figcaption>
      <canvas id="result"></canvas>
    </figure>
  </main>

  <script>
    window.Module = window.Module || {};
    window.Module.onRuntimeInitialized = function () {
      window.dispatchEvent(new Event("opencv-ready"));
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.wasm.min.js"></script>
  <script src="demo.js"></script>
</body>
</html>
